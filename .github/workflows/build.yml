name: Sestavit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Vložit google-services.json ze secretu
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::Chybí secret GOOGLE_SERVICES_JSON (viz README)"
            exit 1
          fi
          printf '%s' "$GS" > app/google-services.json

      - name: Sestavit
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/debug/app-debug.apk CestaDoMordoru.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CestaDoMordoru
          path: CestaDoMordoru.apk

      - name: Vydat jako Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cesta do Mordoru – verze ${{ github.run_number }}
          files: CestaDoMordoru.apk
